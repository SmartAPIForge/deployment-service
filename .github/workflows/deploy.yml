name: Build and Deploy Deployment Service

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'ansible/**'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
  workflow_dispatch:

env:
  KAFKA_SERVERS: ${{ secrets.KAFKA_SERVERS }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: Dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create production config
        run: |
          cat > config/prod.yaml << EOL
          env: "prod"
          grpc: 
            port: 50071
            timeout: 10h
          kafka:
            servers:
              - "${{ secrets.KAFKA_SERVERS }}"
            topics:
              deployment_request:
                name: "NewZip"
                enabled: true
          postgres_db:
            host: "${{ secrets.POSTGRES_HOST }}"
            port: "${{ secrets.POSTGRES_PORT }}"
            user: "${{ secrets.POSTGRES_USER }}"
            password: "${{ secrets.POSTGRES_PASSWORD }}"
            db_name: "${{ secrets.POSTGRES_DB }}"
          EOL

      - name: Run deployment
        run: |
          task init
          
          echo "✅ Deployment successful!"

      - name: Cleanup
        if: always()
        run: |
          # Stop containers and remove volumes
          docker-compose down -v
          
          # Remove dangling images to save disk space
          docker image prune -f
          
          # Kill any processes using the ports
          lsof -ti:50071 | xargs kill -9 2>/dev/null || true